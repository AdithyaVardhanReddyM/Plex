[project]
name = "plex-agent"
version = "0.0.0"
description = "Plex for Mac brain: talker, worker, operator, routines scheduler and memory (Google ADK, Gemini on Vertex AI)"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.11.0",
    "google-genai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "composio>=0.22.0",
    "websockets>=13",
]

[tool.uv]
package = false
