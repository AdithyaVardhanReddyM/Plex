# Plex for Mac. XcodeGen project: run `xcodegen generate` (or `pnpm --filter @plex/mac xcode`)
# and never edit the generated PlexMac.xcodeproj by hand; it is not committed.
name: PlexMac
options:
  bundleIdPrefix: ai.plex
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    DEVELOPMENT_TEAM: 5Q3KU6MZ8A
    CODE_SIGN_STYLE: Manual
    # Debug is signed with the team's Apple Development certificate (not ad hoc) so macOS
    # keeps the Microphone, Accessibility and Screen Recording grants across rebuilds.
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_ENTITLEMENTS: Resources/PlexMac.entitlements
    # Where the app finds the brain until the user changes it in Settings. Both are empty for
    # Debug (the dev server on this Mac). scripts/release.sh passes them on the xcodebuild
    # command line, so neither the address nor the token is ever written into this repo.
    PLEX_BRAIN_URL: ""
    PLEX_BRAIN_TOKEN: ""
  configs:
    Release:
      # A notarized build for judges needs a Developer ID Application certificate
      # (developer.apple.com > Certificates); scripts/release.sh builds it.
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

targets:
  PlexMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.plex.mac
        PRODUCT_NAME: Plex
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Plex
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        # Menu bar app: no Dock icon, the notch is the UI. The main window turns the Dock icon on
        # while it's open.
        LSUIElement: true
        # The hosted brain a release build talks to (BrainSettings reads these; empty = local dev server).
        PlexBrainURL: $(PLEX_BRAIN_URL)
        PlexBrainToken: $(PLEX_BRAIN_TOKEN)
        NSMicrophoneUsageDescription: Plex listens while you hold fn and control, so you can talk to it.
        NSAppleEventsUsageDescription: Plex reads the page you're on, fills in what you ask it to, and sends the messages you approve.
        NSCalendarsFullAccessUsageDescription: Plex reads your plans so it can schedule around them, and adds events you approve.
        NSRemindersFullAccessUsageDescription: Plex reads your lists and adds the reminders you approve, like a bill that's due.
        NSRemindersUsageDescription: Plex reads your lists and adds the reminders you approve, like a bill that's due.
        NSContactsUsageDescription: Plex looks up the people you mention, to pay, split with or message them.
        NSLocationUsageDescription: Plex uses where you are for errands nearby.
        NSLocationWhenInUseUsageDescription: Plex uses where you are for errands nearby.
        NSDesktopFolderUsageDescription: Plex reads the bills and receipts you drop on it or ask about.
        NSDocumentsFolderUsageDescription: Plex reads the bills and receipts you ask about, and saves the files it makes for you.
        NSDownloadsFolderUsageDescription: Plex notices new invoices and receipts in Downloads, and reads the ones you ask about.
        NSAppTransportSecurity:
          # The brain and Convex run on localhost (ws://, http://) while developing.
          NSAllowsLocalNetworking: true

schemes:
  PlexMac:
    build:
      targets:
        PlexMac: all
    run:
      config: Debug
    archive:
      config: Release
